<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Run: The Royal Race</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--
        DRAGON RUN: THE ROYAL RACE
        A PvP Digital Board Game with Fantasy Metal Slug Aesthetic

        Game Container - Phaser 3 will inject the canvas here
    -->
    <div id="game-container"></div>

    <!-- Phaser 3 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <!-- Socket.io client for multiplayer -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Game Scripts - Order matters for class dependencies -->
    <!-- Data definitions (no dependencies) -->
    <script src="js/CharacterData.js?v=3"></script>
    <script src="js/ItemData.js?v=3"></script>
    <script src="js/EncounterData.js?v=3"></script>

    <!-- Core systems -->
    <script src="js/Inventory.js?v=3"></script>
    <script src="js/ProceduralGraphics.js?v=3"></script>
    <script src="js/GameUI.js?v=3"></script>

    <!-- Multiplayer systems -->
    <script src="js/NetworkManager.js?v=3"></script>
    <script src="js/MultiplayerUI.js?v=3"></script>

    <!-- Game objects -->
    <script src="js/Board.js?v=3"></script>
    <script src="js/Player.js?v=3"></script>

    <!-- Main game -->
    <script src="js/game.js?v=3"></script>
</body>
</html>
